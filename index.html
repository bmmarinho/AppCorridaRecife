<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meus Treinos de Corrida</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
        }
        /* Fundo fixo com a imagem das ruas do Recife e sobreposição escura */
        .bg-recife-runner {
            background-image: linear-gradient(rgba(15, 23, 42, 0.86), rgba(15, 23, 42, 0.94)), url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-recife-runner text-slate-100 flex flex-col min-h-screen">

    <!-- Header Fixo Otimizado para Celular -->
    <header class="w-full bg-slate-900/90 backdrop-blur-md border-b border-slate-700/60 px-4 py-3 sticky top-0 z-30 shadow-md">
        <div class="w-full max-w-lg mx-auto flex justify-between items-center">
            <h1 class="text-base sm:text-lg font-bold flex items-center gap-2">
                <i class="fa-solid fa-person-running text-emerald-400"></i> Meus Treinos
            </h1>
            <button onclick="abrirModalSemana()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5 active:scale-95">
                <i class="fa-solid fa-calendar-plus"></i> Atualizar Semana
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal Adaptável -->
    <main class="w-full max-w-lg mx-auto p-3 sm:p-4 flex-1 flex flex-col gap-4 pb-24">

        <!-- Seção: Calendário Interativo -->
        <div class="w-full bg-slate-900/85 backdrop-blur-md rounded-2xl p-4 shadow-lg border border-slate-700/60">
            <!-- Cabeçalho do Mês -->
            <div class="flex justify-between items-center mb-3">
                <button onclick="mudarMes(-1)" class="p-2 text-slate-400 hover:text-white transition"><i class="fa-solid fa-chevron-left"></i></button>
                <h2 id="mesAnoTitulo" class="font-bold text-sm sm:text-base capitalize text-emerald-400"></h2>
                <button onclick="mudarMes(1)" class="p-2 text-slate-400 hover:text-white transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <!-- Dias da Semana -->
            <div class="grid grid-cols-7 text-center text-[11px] sm:text-xs font-semibold text-slate-400 mb-2">
                <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
            </div>

            <!-- Grade de Dias -->
            <div id="gradeDias" class="grid grid-cols-7 gap-1.5 text-center text-xs sm:text-sm"></div>
        </div>

        <!-- Seção: Resumo e Atalhos da Semana -->
        <div class="w-full bg-slate-900/85 backdrop-blur-md rounded-2xl p-4 shadow-lg border border-slate-700/60">
            <h3 class="text-xs sm:text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-emerald-400"></i> Próximos Treinos da Semana
            </h3>
            <div id="resumoSemanaLista" class="space-y-2 text-xs sm:text-sm">
                <!-- Preenchido via JS -->
            </div>
        </div>

    </main>

    <!-- Modal de Detalhes / Edição de Treino -->
    <div id="modalTreino" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-5 sm:p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitulo" class="font-bold text-base sm:text-lg text-emerald-400">Detalhes do Treino</h3>
                <button onclick="fecharModal()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <input type="hidden" id="modalDataId">

            <div class="space-y-3 sm:space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Descrição / Planejamento do Treino</label>
                    <textarea id="modalDescricao" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Ex: 1km aquecimento + tiros..."></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Tempo Total (min)</label>
                        <input type="text" id="modalTempo" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Ex: 34:20">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Pace Médio</label>
                        <input type="text" id="modalPace" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Ex: 5:35 min/km">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase mb-1">Observações / Sensações</label>
                    <input type="text" id="modalObs" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs sm:text-sm text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Ex: Senti o joelho levemente no final...">
                </div>

                <div class="flex items-center gap-3 py-2">
                    <input type="checkbox" id="modalConcluido" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer">
                    <label for="modalConcluido" class="text-xs sm:text-sm font-medium text-slate-200 cursor-pointer">Treino Concluído</label>
                </div>

                <div class="flex gap-3 pt-2">
                    <button onclick="salvarTreinoDia()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl shadow transition text-xs sm:text-sm active:scale-95">Salvar Alterações</button>
                    <button onclick="fecharModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-3 rounded-xl transition text-xs sm:text-sm">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Gerenciamento da Planilha Semanal (Todo Domingo) -->
    <div id="modalSemana" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-5 sm:p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-base sm:text-lg text-emerald-400">📋 Inserir Planilha da Semana</h3>
                <button onclick="fecharModalSemana()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <p class="text-xs text-slate-400 mb-3">Cole ou digite abaixo os treinos enviados pelo seu personal para cada dia desta semana:</p>

            <div class="space-y-2.5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase mb-1">Segunda-feira</label>
                    <input type="text" id="semSeg" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100" placeholder="Ex: Descanso / Off">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase mb-1">Terça-feira</label>
                    <input type="text" id="semTer" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100" placeholder="Ex: 1km aq + 5x200m + 5x100m">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase mb-1">Quarta-feira</label>
                    <input type="text" id="semQua" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100" placeholder="Ex: Descanso / Fortalecimento">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase mb-1">Quinta-feira</label>
                    <input type="text" id="semQui" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100" placeholder="Ex: 1,5km aq + 5x250m + 5x100m">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase mb-1">Sexta-feira</label>
                    <input type="text" id="semSex" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100" placeholder="Ex: Descanso">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase mb-1">Sábado</label>
                    <input type="text" id="semSab" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100" placeholder="Ex: Livre">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-300 uppercase mb-1">Domingo</label>
                    <input type="text" id="semDom" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100" placeholder="Ex: 5km entre 30-40 min">
                </div>

                <div class="flex gap-3 pt-3">
                    <button onclick="salvarPlanilhaSemanal()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl shadow transition text-xs sm:text-sm active:scale-95">Salvar Planilha da Semana</button>
                    <button onclick="fecharModalSemana()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-3 rounded-xl transition text-xs sm:text-sm">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Funcionamento -->
    <script>
        let dataAtual = new Date();
        let treinos = JSON.parse(localStorage.getItem('meus_treinos_corrida')) || {};

        if (Object.keys(treinos).length === 0) {
            const hojeStr = new Date().toISOString().split('T')[0];
            treinos[hojeStr] = {
                descricao: "Terça: 1km aquecimento + 5 tiros de 200m (desc 1m30) + 5 tiros 100m (desc 30s)",
                tempo: "",
                pace: "",
                obs: "",
                concluido: false
            };
            localStorage.setItem('meus_treinos_corrida', JSON.stringify(treinos));
        }

        function formatarDataKey(date) {
            const ano = date.getFullYear();
            const mes = String(date.getMonth() + 1).padStart(2, '0');
            const dia = String(date.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function renderizarApp() {
            renderizarCalendario();
            renderizarResumoSemana();
        }

        function renderizarCalendario() {
            const grade = document.getElementById('gradeDias');
            grade.innerHTML = '';

            const ano = dataAtual.getFullYear();
            const mes = dataAtual.getMonth();

            const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            document.getElementById('mesAnoTitulo').innerText = `${nomesMeses[mes]} de ${ano}`;

            const primeiroDiaDoMes = new Date(ano, mes, 1).getDay();
            const ultimoDiaDoMes = new Date(ano, mes + 1, 0).getDate();
            const hojeStr = formatarDataKey(new Date());

            for (let i = 0; i < primeiroDiaDoMes; i++) {
                const divVazia = document.createElement('div');
                grade.appendChild(divVazia);
            }

            for (let dia = 1; dia <= ultimoDiaDoMes; dia++) {
                const dataObj = new Date(ano, mes, dia);
                const dataStr = formatarDataKey(dataObj);
                const treinoDoDia = treinos[dataStr];

                const celula = document.createElement('div');
                celula.className = `h-11 sm:h-12 rounded-xl flex flex-col items-center justify-center relative cursor-pointer text-xs sm:text-sm font-medium transition ${dataStr === hojeStr ? 'border border-emerald-500' : 'hover:bg-slate-800/60'}`;
                
                if (treinoDoDia) {
                    if (treinoDoDia.concluido) {
                        celula.className += ' bg-emerald-950/70 text-emerald-300 font-bold';
                    } else {
                        celula.className += ' bg-slate-800/80 text-slate-200 font-bold';
                    }
                } else {
                    celula.className += ' text-slate-400';
                }

                celula.innerHTML = `<span>${dia}</span>`;
                if (treinoDoDia) {
                    const ponto = document.createElement('div');
                    ponto.className = `w-1.5 h-1.5 rounded-full mt-0.5 ${treinoDoDia.concluido ? 'bg-emerald-400' : 'bg-amber-400'}`;
                    celula.appendChild(ponto);
                }

                celula.onclick = () => abrirModalTreino(dataStr);
                grade.appendChild(celula);
            }
        }

        function mudarMes(direcao) {
            dataAtual.setMonth(dataAtual.getMonth() + direcao);
            renderizarCalendario();
        }

        function abrirModalTreino(dataStr) {
            document.getElementById('modalDataId').value = dataStr;
            const treino = treinos[dataStr] || { descricao: '', tempo: '', pace: '', obs: '', concluido: false };
            
            const [ano, mes, dia] = dataStr.split('-');
            document.getElementById('modalTitulo').innerText = `Treino de ${dia}/${mes}/${ano}`;
            document.getElementById('modalDescricao').value = treino.descricao;
            document.getElementById('modalTempo').value = treino.tempo || '';
            document.getElementById('modalPace').value = treino.pace || '';
            document.getElementById('modalObs').value = treino.obs || '';
            document.getElementById('modalConcluido').checked = treino.concluido || false;

            const modal = document.getElementById('modalTreino');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function fecharModal() {
            const modal = document.getElementById('modalTreino');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function salvarTreinoDia() {
            const dataStr = document.getElementById('modalDataId').value;
            const descricao = document.getElementById('modalDescricao').value;
            const tempo = document.getElementById('modalTempo').value;
            const pace = document.getElementById('modalPace').value;
            const obs = document.getElementById('modalObs').value;
            const concluido = document.getElementById('modalConcluido').checked;

            if (!descricao && !tempo && !pace) {
                delete treinos[dataStr];
            } else {
                treinos[dataStr] = { descricao, tempo, pace, obs, concluido };
            }

            localStorage.setItem('meus_treinos_corrida', JSON.stringify(treinos));
            fecharModal();
            renderizarApp();
        }

        function abrirModalSemana() {
            const modal = document.getElementById('modalSemana');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function fecharModalSemana() {
            const modal = document.getElementById('modalSemana');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function salvarPlanilhaSemanal() {
            const hoje = new Date();
            const diaSemana = hoje.getDay();
            const diffSegunda = hoje.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
            let segundaFeira = new Date(hoje.setDate(diffSegunda));

            const diasInputs = ['semSeg', 'semTer', 'semQua', 'semQui', 'semSex', 'semSab', 'semDom'];

            diasInputs.forEach((idInput, index) => {
                const valorDesc = document.getElementById(idInput).value.trim();
                if (valorDesc) {
                    let d = new Date(segundaFeira);
                    d.setDate(segundaFeira.getDate() + index);
                    const dataStr = formatarDataKey(d);

                    if (!treinos[dataStr]) {
                        treinos[dataStr] = { descricao: valorDesc, tempo: '', pace: '', obs: '', concluido: false };
                    } else {
                        treinos[dataStr].descricao = valorDesc;
                    }
                }
            });

            localStorage.setItem('meus_treinos_corrida', JSON.stringify(treinos));
            fecharModalSemana();
            renderizarApp();
            alert('Planilha da semana salva com sucesso!');
        }

        function renderizarResumoSemana() {
            const lista = document.getElementById('resumoSemanaLista');
            lista.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                let d = new Date();
                d.setDate(d.getDate() + i);
                const dataStr = formatarDataKey(d);
                const treino = treinos[dataStr];

                const diasNomes = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
                const nomeDia = diasNomes[d.getDay()];
                const dataFormatada = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;

                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border flex justify-between items-center cursor-pointer transition ${treino?.concluido ? 'bg-emerald-950/50 border-emerald-800/50' : 'bg-slate-900/85 border-slate-700/60 hover:bg-slate-800/80'}`;
                
                item.onclick = () => abrirModalTreino(dataStr);

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-center min-w-[38px]">
                            <span class="block text-[10px] font-bold text-slate-400 uppercase">${nomeDia}</span>
                            <span class="block text-xs font-semibold text-slate-200">${dataFormatada}</span>
                        </div>
                        <div class="text-xs">
                            <p class="font-medium text-slate-200">${treino ? treino.descricao : '<span class="text-slate-500 italic">Nenhum treino cadastrado</span>'}</p>
                            ${treino?.tempo ? `<p class="text-emerald-400 text-[11px] mt-0.5">Tempo: ${treino.tempo}${treino.pace ? '| Pace: ' + treino.pace : ''}</p>` : ''}
                        </div>
                    </div>
                    <div>
                        <i class="fa-solid ${treino?.concluido ? 'fa-circle-check text-emerald-400 text-base' : 'fa-chevron-right text-slate-600 text-xs'}"></i>
                    </div>
                `;
                lista.appendChild(item);
            }
        }

        renderizarApp();
    </script>
</body>
</html>
